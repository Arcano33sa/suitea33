<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#7b1818" />
  <title>Centro de Mando · Sin conexión</title>
  <style>
    *{box-sizing:border-box}html,body{min-height:100%;margin:0;overflow-x:hidden}body{display:grid;place-items:center;padding:max(18px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));background:linear-gradient(180deg,#faf7f1,#f1e9dd);color:#231c19;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.card{width:min(620px,100%);padding:24px;border:1px solid rgba(92,62,42,.2);border-radius:20px;background:#fffdf9;box-shadow:0 18px 50px rgba(55,34,19,.14)}h1{margin:0 0 10px;color:#7b1818;font-size:clamp(1.35rem,4vw,1.8rem)}p{margin:0 0 18px;color:#716861;line-height:1.5}.actions{display:flex;flex-wrap:wrap;gap:10px}button,a{min-height:44px;padding:10px 15px;border:1px solid rgba(123,24,24,.3);border-radius:999px;background:#fff;color:#7b1818;font:inherit;font-weight:800;text-decoration:none;cursor:pointer;touch-action:manipulation}.primary{border-color:#7b1818;background:#7b1818;color:#fff}@media(max-width:480px){.actions{flex-direction:column}.actions>*{width:100%;text-align:center}}
  </style>
</head>
<body>
  <main class="card">
    <h1>Centro de Mando sin conexión</h1>
    <p>No fue posible actualizar la vista. Puedes reintentar; si el módulo ya fue abierto antes, el Service Worker conservará su funcionamiento offline.</p>
    <div class="actions">
      <button class="primary" type="button" onclick="location.href='./index.html'">Reintentar</button>
      <a href="../index.html">Menú principal</a>
    </div>
  </main>
</body>
</html>
